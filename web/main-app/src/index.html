<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>MainApp</title>
  <script>
    (function () {
      var relayPrefix = window.location.pathname.match(/^\/d\/[^/]+\/?/);
      var baseHref = relayPrefix ? relayPrefix[0].replace(/\/?$/, '/') : '/';
      document.write('<base href="' + baseHref + '">');
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon2.ico">
</head>

</body>

</html>
